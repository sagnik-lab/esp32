name: Build ESP32
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2

      - name: Cache arduino15
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ hashFiles('**/build.yml') }}

      - name: Build
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

          mkdir -p ~/Arduino/libraries
          if [ -d "libraries" ]; then
            for zipfile in libraries/*.zip; do
              [ -e "$zipfile" ] || continue
              echo "Installing $zipfile"
              unzip -oq "$zipfile" -d /tmp/lib_extract
            done
            for dir in /tmp/lib_extract/*/; do
              [ -e "$dir" ] || continue
              cp -r "$dir" ~/Arduino/libraries/
            done
          fi

          arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --output-dir out sketch

          mkdir -p renamed
          cp out/sketch.ino.bootloader.bin renamed/sketch_bootloader.bin
          cp out/sketch.ino.partitions.bin renamed/sketch_partitions.bin
          cp out/sketch.ino.bin renamed/sketch_app.bin

          OTA_FILE=$(find ~/.arduino15/packages/esp32 -name "boot_app0.bin" | head -n 1)
          if [ -n "$OTA_FILE" ]; then
            cp "$OTA_FILE" renamed/sketch_ota.bin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: renamed/*.bin
