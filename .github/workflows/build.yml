name: Build ESP32
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2

      - name: Cache arduino15
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-esp32-${{ hashFiles('**/build.yml') }}

      - name: Build
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

          mkdir -p ~/Arduino/libraries
          if [ -d "libraries" ]; then
            for zipfile in libraries/*.zip; do
              [ -e "$zipfile" ] || continue
              echo "Installing $zipfile"
              unzip -oq "$zipfile" -d /tmp/lib_extract
            done
            for dir in /tmp/lib_extract/*/; do
              [ -e "$dir" ] || continue
              cp -r "$dir" ~/Arduino/libraries/
            done
          fi

          # Find whatever .ino file is inside sketch/, regardless of its name
          INO_PATH=$(find sketch -maxdepth 1 -name "*.ino" | head -n 1)
          if [ -z "$INO_PATH" ]; then
            echo "No .ino file found inside sketch/"
            exit 1
          fi
          INO_NAME=$(basename "$INO_PATH" .ino)
          echo "Found sketch: $INO_NAME"

          # Make the sketch name available to later steps
          echo "INO_NAME=$INO_NAME" >> "$GITHUB_ENV"

          # arduino-cli requires the sketch folder name to match the .ino filename,
          # so stage it into a correctly named temp folder before compiling
          mkdir -p build_src/"$INO_NAME"
          cp "$INO_PATH" build_src/"$INO_NAME"/

          arduino-cli compile --fqbn esp32:esp32:esp32doit-devkit-v1 --export-binaries --output-dir out build_src/"$INO_NAME"

          mkdir -p renamed
          cp out/"$INO_NAME".ino.bootloader.bin renamed/"${INO_NAME}"_bootloader.bin
          cp out/"$INO_NAME".ino.partitions.bin renamed/"${INO_NAME}"_partitions.bin
          cp out/"$INO_NAME".ino.bin renamed/"${INO_NAME}"_app.bin
          cp out/"$INO_NAME".ino.merged.bin renamed/"${INO_NAME}"_merged.bin

          OTA_FILE=$(find ~/.arduino15/packages/esp32 -name "boot_app0.bin" | head -n 1)
          if [ -n "$OTA_FILE" ]; then
            cp "$OTA_FILE" renamed/"${INO_NAME}"_ota.bin
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.INO_NAME }}_firmware
          path: renamed/*.bin
